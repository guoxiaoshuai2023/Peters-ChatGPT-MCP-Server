name: Verification CI (v0.5.5/v0.5.6 frozen & v0.5.7 candidate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Retain required check context name `v055-ci` to match main-protection ruleset.
  v055-ci:
    name: v055-ci
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r versions/0.5.7/requirements.lock

      - name: Run synthetic unit and security regression suite (versions/0.5.7)
        working-directory: versions/0.5.7
        shell: bash
        run: |
          set -euo pipefail
          # Exclude only the 5 bare-metal micro-timing / RSS-allocator modules on shared
          # hosted macOS VMs; they remain mandatory in bare-metal pre-release verification.
          TARGETS=()
          for f in tests/test_*.py; do
            base="$(basename "$f" .py)"
            case "$base" in
              test_file_source|test_history_limits|test_history_process|test_owner_rehearsal_infrastructure|test_v055_background_qos_and_timeout_recovery)
                continue
                ;;
            esac
            TARGETS+=("$base")
          done
          # Still run the 3 deterministic v0.5.5 background-QoS & revocation tests
          TARGETS+=(
            "test_v055_background_qos_and_timeout_recovery.BackgroundQosAndTimeoutRecoveryTests.test_capture_iter_emits_multiple_cooperative_scanning_checkpoints"
            "test_v055_background_qos_and_timeout_recovery.BackgroundQosAndTimeoutRecoveryTests.test_background_qos_cold_large_antigravity_find_and_full_read_without_step_timeout"
            "test_v055_background_qos_and_timeout_recovery.BackgroundQosAndTimeoutRecoveryTests.test_v2_revocation_blocks_timeout_and_stale_cursors_without_status_or_data_leak"
          )
          echo "Running ${#TARGETS[@]} deterministic unittest targets via python -m unittest..."
          PYTHONPATH=".:tests" PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v "${TARGETS[@]}"

      - name: Verify reproducible candidate & rollback build fingerprints (v0.5.5/v0.5.6 frozen & v0.5.7 candidate)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          for version_dir in ("versions/0.5.5", "versions/0.5.6", "versions/0.5.7"):
              src = Path(version_dir).resolve()
              spec = json.loads((src / "BUILD_SPEC.json").read_text(encoding="utf-8"))
              with tempfile.TemporaryDirectory(prefix=f"ci-build-{src.name}-") as tmp:
                  out = Path(tmp).resolve() / "release"
                  cmd = [
                      sys.executable, "-B", str(src / "tools/build_file_release.py"),
                      "--source", str(src),
                      "--output", str(out),
                      "--snapshot-id", spec["snapshot_id"],
                  ]
                  for item in spec["include"]:
                      cmd.extend(["--include", item])
                  built = json.loads(subprocess.check_output(cmd, text=True))
                  assert built["candidate"] == spec["candidate_fingerprint"], (version_dir, built)
                  assert built["rollback"] == spec["rollback_fingerprint"], (version_dir, built)
                  for mode in ("candidate", "rollback"):
                      verified = json.loads(subprocess.check_output(
                          [sys.executable, "-B", str(src / "tools/build_file_release.py"), "--verify", str(out / mode)],
                          text=True,
                      ))
                      assert verified["bundle_mode"] == mode
                      assert verified["content_fingerprint"] == built[mode]
                  manifest = json.loads((out / "candidate" / "manifest.json").read_text(encoding="utf-8"))
                  assert manifest["source_content_fingerprint"] == spec["source_content_fingerprint"]
              print(f"BUILD_AND_FINGERPRINT_VERIFIED ({version_dir}): OK")
          PY

      - name: Public repository privacy & bytecode hygiene scan
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          rules = [
              ("pycache", re.compile(r"(?:^|/)__pycache__/|\.pyc$")),
              ("personal_home", re.compile(r"/(?:Users|home)/(?!user\b|alice\b|example\b|synthetic-person\b|demo\b|someone\b|operator\b|runner\b|tester\b|<)[^\s/\"'`<>]+")),
              ("private_key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
              ("provider_token", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})\b")),
              ("jwt_value", re.compile(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b")),
          ]
          violations = []
          for rel in tracked:
              if rules[0][1].search(rel):
                  violations.append((rel, "pycache", rel))
                  continue
              path = Path(rel)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for name, rx in rules[1:]:
                  for m in rx.finditer(text):
                      val = m.group(0)
                      if rel.endswith("test_history.py") and val == ("sk-" + "test1234567890123456"):
                          continue
                      if rel.endswith("test_file_release.py") and name == "private_key":
                          continue
                      violations.append((rel, name, val[:60]))
          if violations:
              for v in violations[:20]:
                  print("VIOLATION:", v)
              raise SystemExit(1)
          print(f"PRIVACY_HYGIENE_SCAN: OK ({len(tracked)} tracked files, 0 violations)")
          PY
